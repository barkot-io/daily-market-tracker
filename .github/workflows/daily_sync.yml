name: Daily Data Extraction

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Pipeline
        run: python main.py

      - name: Commit updated CSV data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily_rates.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: sync exchange rates [skip ci]" && git push)